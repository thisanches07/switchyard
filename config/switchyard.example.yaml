# Switchyard configuration. Copy to config/switchyard.yaml.
# Validated with Zod at boot; hot-reloaded on change (spec 008).
# Model IDs below are examples: check each provider's docs for current names.

server:
  bodyLimitBytes: 1048576
  trustProxy: false            # true only behind a trusted reverse proxy (X-Forwarded-For)
  timeouts:
    connectMs: 5000
    ttfbMs: 30000
    totalMs: 120000

providers:
  ollama:
    type: openai-compatible
    baseUrlEnv: OLLAMA_BASE_URL          # host.docker.internal:11434 from containers
  groq:
    type: openai-compatible
    baseUrl: https://api.groq.com/openai/v1
    apiKeyEnv: GROQ_API_KEY
  gemini:
    type: openai-compatible
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
    apiKeyEnv: GEMINI_API_KEY
  claude:
    type: anthropic                      # also serves POST /v1/messages natively (spec 014)
    apiKeyEnv: ANTHROPIC_API_KEY
    defaultMaxTokens: 4096               # max_tokens when an OpenAI request sets none
  mock:
    type: mock                           # tests and benchmarks only
    latencyMs: 50
    errorRate: 0

aliases:
  local:
    strategy: priority
    candidates: [ollama/llama3.2]
  fast:
    strategy: priority
    candidates: [groq/llama-3.1-8b-instant, gemini/gemini-2.5-flash, ollama/llama3.2]
  smart:
    strategy: lowest-latency
    candidates: [claude/claude-sonnet-5-5, gemini/gemini-2.5-pro]
  embed:
    strategy: priority
    candidates: [ollama/nomic-embed-text]   # 768 dims (ADR-0005)

limits:                        # spec 005: per-minute limits enforced in Redis
  defaults:                    # for keys without their own rpm/tpm; remove for unlimited
    rpm: 60
    tpm: 100000
  completionReserveTokens: 512 # reserved per request when max_tokens is not set
  onRedisError: open           # open: keep serving if Redis is down; closed: return 503
  authFailuresPerMinutePerIp: 30

usage:                         # spec 006: one usage event per admitted request, via Kafka
  enabled: true                # needs KAFKA_BROKERS; false: events are built but never published
  topic: usage.events.v1
  dlqTopic: usage.events.dlq   # malformed events, set aside by the usage worker
  bufferSize: 10000            # events held in memory while Kafka is slow or down, then dropped
  flushIntervalMs: 200

budgets:                       # spec 007: monthly budgets per key and team, see docs/budgets.md
  onRedisError: closed         # closed: 503 for keys/teams with a budget if Redis is down; open: admit
  reconcileIntervalSeconds: 60 # usage worker: raise Redis spend counters to the Postgres totals

pii:                           # spec 010: PII redaction, see docs/pii.md
  defaultMode: off             # off | mask | block, for keys without their own piiMode
  detectors: [email, phone, card, cpf, cnpj, ip, term]
  denyList: []                 # literal terms (not regexes), case-insensitive, whole words

retry:
  maxAttempts: 3
  baseDelayMs: 200
  maxDelayMs: 2000

circuitBreaker:
  failureThreshold: 5        # consecutive failures to open
  openMs: 30000              # time before half-open probe

cache:
  exact:
    enabled: true
    ttlSeconds: 3600
  semantic:
    enabled: false           # opt-in per key as well
    embeddingModel: ollama/nomic-embed-text   # 768 dims, see ADR-0005
    similarityThreshold: 0.95
    ttlSeconds: 86400

pricingFile: config/pricing.yaml   # spec 007: USD per 1M tokens; unverified prices stay TODO
