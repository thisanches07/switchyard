# Local stack for Switchyard (spec 001). `docker compose --profile ollama up -d` adds an Ollama
# Ports are published on 127.0.0.1 only: the /v1 API is unauthenticated until spec 004.
# container for CPU-only/Linux setups; by default the gateway uses Ollama running on the host.
name: switchyard

services:
  gateway:
    build: .
    image: switchyard-gateway:dev
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWITCHYARD_CONFIG: /app/config/${SWITCHYARD_CONFIG_NAME:-switchyard.example.yaml}
      DATABASE_URL: postgres://switchyard:switchyard@postgres:5432/switchyard
      REDIS_URL: redis://redis:6379
      # dev-only defaults so "docker compose up" works out of the box; override in .env
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token-change-me}
      KEY_PEPPER: ${KEY_PEPPER:-dev-only-pepper-change-me-0123456789abcdef}
      MIGRATE_ON_BOOT: "true"
      # Usage events (spec 006); the gateway starts and serves even while Redpanda is down.
      KAFKA_BROKERS: redpanda:9092
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      OTEL_SERVICE_NAME: switchyard-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Usage worker (spec 006): Kafka → Postgres, idempotent, DLQ. Same image as the gateway.
  usage-worker:
    build: .
    image: switchyard-gateway:dev
    init: true
    command: ["node", "--import", "./dist/infra/telemetry/register-worker.js", "dist/worker.js"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWITCHYARD_CONFIG: /app/config/${SWITCHYARD_CONFIG_NAME:-switchyard.example.yaml}
      DATABASE_URL: postgres://switchyard:switchyard@postgres:5432/switchyard
      KAFKA_BROKERS: redpanda:9092
      OTEL_SERVICE_NAME: switchyard-usage-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redpanda:
        condition: service_healthy
      # Healthy once its migrations (usage tables included) have run.
      gateway:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: switchyard
    ports:
      # 55432 avoids clashing with a natively installed PostgreSQL on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data

  ollama:
    image: ollama/ollama:0.40.2
    profiles: [ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pg-data:
  redis-data:
  redpanda-data:
  lgtm-data:
  ollama-data:
